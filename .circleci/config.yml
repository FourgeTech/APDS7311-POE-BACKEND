version: 2.1
orbs:
  node: circleci/node@5

jobs:
  test-node:
    # Install node dependencies and run tests
    executor: node/default
    environment:
      JEST_JUNIT_OUTPUT_DIR: ./test-results/
    steps:
      - checkout
      - node/install-packages:
          pkg-manager: npm
      - run:
          command: npm install jest-junit
      - run:
          name: Run tests
          command: npm run test --ci --runInBand --reporters=default --reporters=jest-junit
      - store_test_results:
          path: ./test-results/

  sonar-analysis:
    # Run SonarQube analysis
    docker:
      - image: sonarsource/sonar-scanner-cli:latest  
    steps:
      - checkout
      - run:
          name: Run SonarQube analysis
          command: |
            sonar-scanner \
              -Dsonar.projectKey=$SONAR_PROJECT_KEY \
              -Dsonar.sources=. \
              -Dsonar.host.url=$SONAR_HOST_URL \
              -Dsonar.login=$SONAR_TOKEN     

  deploy-to-vercel:
    # Deploy to Vercel
    docker:
      - image: circleci/node:latest  # Node image with npm for Vercel CLI
    steps:
      - checkout
      - run:
          name: Install Vercel CLI
          command: npm install -g vercel
      - run:
          name: Deploy to Vercel
          command: |
            vercel --token $VERCEL_TOKEN --org-id $VERCEL_ORG_ID --project-id $VERCEL_PROJECT_ID --prod
      # Note: Set VERCEL_TOKEN, VERCEL_ORG_ID, and VERCEL_PROJECT_ID in CircleCI Project Environment Variables

workflows:
  build-test-and-deploy:
    jobs:
      - test-node
      - sonar-analysis:
          requires:
            - test-node
      - deploy-to-vercel:
          requires:
            - test-node
          filters:
            branches:
              only: main
